name: GDS Board Sync

# Moves every closed issue's card on the Projects v2 board (project #11) to
# "Done" after a release. This is the CI counterpart to
# `npm run board:sync-release` (scripts/sync-release-board.mjs), which needs the
# `gh` CLI (preinstalled on GitHub-hosted runners).
#
# AUTH: project #11 is an ORG-level Projects v2 board, and the default
# GITHUB_TOKEN cannot write org Projects v2. This job reads a secret
# `GDS_PROJECT_TOKEN` — a classic PAT with `repo` + `project` scopes, or a
# fine-grained PAT with Issues: read/write + Projects: read/write for the
# `sovereignsquad` org. If that secret is not set, the job warns and skips
# instead of failing the release. See issue #431.
#
# TRIGGER: `workflow_run` after "GDS Release Bundles" completes, plus manual
# dispatch. This deliberately does NOT use `push: tags` — per
# auto-tag-release.yml, a tag pushed by the default GITHUB_TOKEN never fires
# other workflows' `push`/`tag` triggers (GitHub's anti-recursion rule), so a
# tag trigger here would silently never run. `workflow_run` is unaffected by it.

on:
  workflow_run:
    workflows: ["GDS Release Bundles"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gds-board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    # On workflow_run, only sync when the release bundle actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync release board (closed issues -> Done)
        env:
          # PAT with Projects v2 write on the sovereignsquad org (see header).
          GH_TOKEN: ${{ secrets.GDS_PROJECT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=Board sync skipped::Secret GDS_PROJECT_TOKEN is not set. Projects v2 writes on org project #11 require a PAT with 'project' scope (the default GITHUB_TOKEN cannot). Add the secret to enable automatic board sync — see issue #431."
            exit 0
          fi
          node scripts/sync-release-board.mjs
