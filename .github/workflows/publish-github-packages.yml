name: GDS Publish (GitHub Packages)

# Publishes all seven GDS packages to GitHub Packages' npm-compatible registry
# (npm.pkg.github.com) instead of npmjs.com. Authenticates with the workflow
# run's own ambient GITHUB_TOKEN (scoped by the `packages: write` permission
# below) — no separate npm.com account or NPM_TOKEN secret required. This is
# a second, independent distribution channel alongside publish-npm.yml
# (npmjs.com) and release-bundles.yml (GitHub Release tarballs); a failure or
# missing credential in one channel never blocks the others, since each is
# its own workflow with its own trigger and auth.
#
# Consumers install from this channel by adding to their .npmrc:
#   @sovereignsquad:registry=https://npm.pkg.github.com
# and authenticating with a personal access token that has at least
# `read:packages` scope (GitHub Packages requires authentication for every
# install, even for public packages — unlike npmjs.com). See the
# "GitHub Packages" section in RELEASE_PUBLISH.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "gds-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GDS_NPM_REGISTRY: https://npm.pkg.github.com

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@sovereignsquad"

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install Linux native build bindings
        run: npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu

      - name: Verify release quality gates
        run: npm run verify:release

      - name: Publish packages to GitHub Packages
        run: npm run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Packages publication
        run: node scripts/check-registry-publication.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDS_REGISTRY_RETRIES: 15
          GDS_REGISTRY_DELAY_MS: 10000
