name: GDS Quality

on:
  pull_request:
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (mantine-${{ matrix.mantine-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mantine-version: [7, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install Linux native build bindings
        run: npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu

      - name: Override to Mantine 9
        if: matrix.mantine-version == 9
        run: npm install --no-save @mantine/core@^9 @mantine/hooks@^9 @mantine/notifications@^9

      - name: Verify release alignment and quality gates
        run: npm run verify:release
